<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — TechHub</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="TechHub_Logo.png" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary, #070b16); color: var(--text-primary, #fff); min-height: 100vh; }
    .hidden { display: none !important; }
    /* TechHub logo as a faint background for admin panel lang po towww */
    body::before { content: ''; position: fixed; inset: 0; background: url('TechHub_Logo.png') center / min(70vmin, 640px) no-repeat; opacity: 0.10; pointer-events: none; z-index: 0; }
    #login-view, #app { position: relative; z-index: 1; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .panel { background: rgba(15, 22, 41, 0.88); border: 1px solid var(--border-color, #1e2d4a); border-radius: 16px; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1, .adm-brand { font-family: 'Outfit', sans-serif; font-weight: 800; }
    .fld { display: block; margin-top: 14px; font-size: .82rem; font-weight: 700; color: var(--text-secondary, #94a3b8); }
    .fld input, .fld select, .fld textarea { width: 100%; margin-top: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border-color, #1e2d4a); background: #0a1020; color: #fff; font: inherit; }
    .err { color: #f87171; font-size: .85rem; min-height: 1.2em; margin-top: 10px; }
    .adm-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border-color, #1e2d4a); position: sticky; top: 0; background: rgba(7, 11, 22, 0.88); backdrop-filter: blur(6px); z-index: 20; }
    .adm-brand { font-size: 1.3rem; } .adm-brand span { color: var(--accent-blue-light, #60a5fa); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border-color, #1e2d4a); background: transparent; color: var(--text-secondary, #94a3b8); font-weight: 700; cursor: pointer; }
    .tab.active { background: var(--accent-blue, #3b82f6); border-color: var(--accent-blue, #3b82f6); color: #fff; }
    .pill { display: inline-block; min-width: 20px; padding: 1px 7px; margin-left: 6px; border-radius: 99px; background: #ef4444; color: #fff; font-size: .72rem; }
    main { max-width: 1250px; margin: 0 auto; padding: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat b { display: block; font-family: 'Outfit', sans-serif; font-size: 1.7rem; margin-top: 6px; } .stat small { color: var(--text-secondary, #94a3b8); font-weight: 600; }
    .cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; } @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    h2 { font-family: 'Outfit', sans-serif; font-size: 1.15rem; margin-bottom: 12px; }
    .tbl-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { text-align: left; color: var(--text-secondary, #94a3b8); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; }
    td { padding: 10px; border-top: 1px solid var(--border-color, #1e2d4a); vertical-align: middle; }
    .thumb { width: 46px; height: 46px; object-fit: contain; background: #fff; border-radius: 8px; }
    .chip { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .72rem; font-weight: 800; }
    .ok { background: rgba(16,185,129,.18); color: #34d399; } .low { background: rgba(245,158,11,.18); color: #fbbf24; } .out { background: rgba(239,68,68,.18); color: #f87171; } .new { background: rgba(59,130,246,.2); color: #60a5fa; }
    .stk { width: 78px; padding: 7px; border-radius: 8px; border: 1px solid var(--border-color, #1e2d4a); background: #0a1020; color: #fff; font: inherit; }
    .btn-s { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-color, #1e2d4a); background: #121b33; color: #fff; font-weight: 700; font-size: .8rem; cursor: pointer; }
    .btn-s:hover { border-color: var(--accent-blue, #3b82f6); } .btn-s.danger { color: #f87171; } .btn-p { background: var(--accent-blue, #3b82f6); border-color: var(--accent-blue, #3b82f6); }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; } .bar input, .bar select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color, #1e2d4a); background: #0a1020; color: #fff; font: inherit; }
    .bar .grow { flex: 1; min-width: 180px; }
    .msg { border-top: 1px solid var(--border-color, #1e2d4a); padding: 14px 4px; } .msg:first-child { border-top: 0; }
    .msg-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; } .msg p { margin: 10px 0; color: #cbd5e1; white-space: pre-wrap; line-height: 1.55; }
    .muted { color: var(--text-secondary, #94a3b8); font-size: .82rem; } .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-box { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; } .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .toast-a { position: fixed; bottom: 22px; right: 22px; background: #10b981; color: #04210f; font-weight: 700; padding: 11px 18px; border-radius: 10px; z-index: 99; }
    .empty { color: var(--text-secondary, #94a3b8); padding: 22px 6px; text-align: center; }
  </style>
</head>
<body data-page="admin">

  <!-- LOGIN -->
  <div class="login-wrap" id="login-view">
    <form class="panel login-card" id="login-form" autocomplete="off">
      <h1>Tech<span style="color:#60a5fa">Hub</span> Admin</h1>
      <p class="muted" style="margin-top:6px">Sign in to manage products, stock, and customer messages.</p>
      <label class="fld">Username<input id="a-user" type="text" required /></label>
      <label class="fld">Password<input id="a-pass" type="password" required /></label>
      <div class="err" id="login-err"></div>
      <button class="btn btn-primary btn-block glow-blue" type="submit" style="margin-top:6px">Sign In</button>
      <p class="muted" style="margin-top:14px"><a href="index.html" style="color:#60a5fa">&larr; Go back to store</a></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="adm-top">
      <div class="adm-brand">Tech<span>Hub</span> Admin</div>
      <div class="tabs">
        <button class="tab active" data-tab="dashboard">Dashboard</button>
        <button class="tab" data-tab="products">Products</button>
        <button class="tab" data-tab="messages">Messages<span class="pill hidden" id="msg-pill">0</span></button>
      </div>
      <div class="actions"><a class="btn-s" href="index.html" target="_blank" rel="noopener">View Store</a><button class="btn-s danger" id="logout-btn">Log out</button></div>
    </div>
    <main>
      <section id="tab-dashboard"></section>
      <section id="tab-products" class="hidden"></section>
      <section id="tab-messages" class="hidden"></section>
    </main>
  </div>

  <!-- PRODUCT FORM -->
  <div class="modal-bg hidden" id="pm">
    <form class="panel modal-box" id="pm-form">
      <h2 id="pm-title">Add Product</h2>
      <label class="fld">Product name<input id="f-name" required /></label>
      <div class="row2">
        <label class="fld">Brand<input id="f-brand" required /></label>
        <label class="fld">Category<select id="f-cat"></select></label>
      </div>
      <div class="row2">
        <label class="fld">Price (&#8369;)<input id="f-price" type="number" min="1" required /></label>
        <label class="fld">Old price (&#8369;, optional)<input id="f-old" type="number" min="0" /></label>
      </div>
      <div class="row2">
        <label class="fld">Stock<input id="f-stock" type="number" min="0" value="20" required /></label>
        <label class="fld">Image file name or link<input id="f-img" placeholder="example.jpg" /></label>
      </div>
      <label class="fld">Or upload a picture<input id="f-file" type="file" accept="image/*" /></label>
      <label class="fld">Description<textarea id="f-def" rows="3"></textarea></label>
      <label class="fld">Key specifications (one per line)<textarea id="f-specs" rows="5" placeholder="6.8-inch AMOLED display&#10;12GB RAM + 256GB storage&#10;5000mAh battery"></textarea></label>
      <label class="fld">Color variants (separated by commas, optional)<input id="f-colors" placeholder="Black, White, Blue" /></label>
      <div class="err" id="pm-err"></div>
      <div class="actions" style="margin-top:10px"><button class="btn-s btn-p" type="submit">Save</button><button class="btn-s" type="button" id="pm-cancel">Cancel</button></div>
    </form>
  </div>

  <script src="script.js"></script>
  <script>
    // ====== Admin Account!! ======
    const ADMIN_USER = 'techhub';
    const ADMIN_PASS = 'gowiththeflowerroroverflow';
    // =========================================
    const $ = (id) => document.getElementById(id);
    const peso = (n) => '\u20b1' + Number(n || 0).toLocaleString('en-US');
    const CATS = ['smartphones', 'laptops', 'audio', 'tablets', 'wearables', 'gaming'];
    let editingId = null, imageData = null;

    function toast(t) { const d = document.createElement('div'); d.className = 'toast-a'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
    function loadJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
    function allOrders() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.indexOf('techhub_orders_') === 0) loadJSON(k, []).forEach(o => out.push(Object.assign({ customer: k.replace('techhub_orders_', '') }, o)));
      }
      return out.sort((a, b) => new Date(b.date) - new Date(a.date));
    }
    function statusChip(id) { const s = getStock(id); return s <= 0 ? '<span class="chip out">Sold out</span>' : s <= LOW_STOCK_LIMIT ? '<span class="chip low">Low</span>' : '<span class="chip ok">In stock</span>'; }

    // ---------- login ----------
    function showApp() { $('login-view').classList.add('hidden'); $('app').classList.remove('hidden'); renderAll(); }
    $('login-form').addEventListener('submit', e => {
      e.preventDefault();
      if ($('a-user').value.trim() === ADMIN_USER && $('a-pass').value === ADMIN_PASS) { sessionStorage.setItem('techhub_admin', '1'); showApp(); }
      else $('login-err').textContent = 'Wrong username or password.';
    });
    $('logout-btn').addEventListener('click', () => { sessionStorage.removeItem('techhub_admin'); location.reload(); });
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
      ['dashboard', 'products', 'messages'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
      renderAll();
    }));

    // ---------- dashboard ----------
    function renderDashboard() {
      const orders = allOrders(), users = loadJSON('techhub_users', []), msgs = loadJSON('techhub_messages', []);
      const ids = Object.keys(PRODUCTS_DATA), sold = ids.filter(isSoldOut), low = ids.filter(i => !isSoldOut(i) && getStock(i) <= LOW_STOCK_LIMIT);
      const sales = orders.reduce((n, o) => n + (Number(o.total) || 0), 0), fresh = msgs.filter(m => m.status === 'new').length;
      const stat = (l, v) => '<div class="panel stat"><small>' + l + '</small><b>' + v + '</b></div>';
      const rows = orders.slice(0, 8).map(o => '<tr><td>' + escapeHtml(o.orderNum) + '</td><td>' + escapeHtml(o.customer) + '</td><td>' + new Date(o.date).toLocaleDateString() + '</td><td>' + (o.items || []).length + '</td><td>' + peso(o.total) + '</td></tr>').join('');
      const watch = sold.concat(low).slice(0, 10).map(i => '<tr><td>' + escapeHtml(PRODUCTS_DATA[i].name) + '</td><td>' + getStock(i) + '</td><td>' + statusChip(i) + '</td></tr>').join('');
      $('tab-dashboard').innerHTML = '<div class="stats">' + stat('Total sales', peso(sales)) + stat('Orders', orders.length) + stat('Registered users', users.length) + stat('Products', ids.length) + stat('Sold out', sold.length) + stat('Low stock', low.length) + stat('New messages', fresh) + '</div>' +
        '<div class="cols"><div class="panel"><h2>Recent orders</h2><div class="tbl-wrap"><table><tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th></tr>' + (rows || '') + '</table></div>' + (rows ? '' : '<div class="empty">No orders yet in this browser.</div>') + '</div>' +
        '<div class="panel"><h2>Stock watch</h2><div class="tbl-wrap"><table><tr><th>Product</th><th>Stock</th><th>Status</th></tr>' + (watch || '') + '</table></div>' + (watch ? '' : '<div class="empty">All products are well stocked.</div>') + '</div></div>';
    }

    // ---------- products ----------
    let q = '', cat = 'all';
    function renderProducts() {
      const box = $('tab-products');
      if (!box.dataset.ready) {
        box.dataset.ready = '1';
        box.innerHTML = '<div class="bar"><input class="grow" id="p-q" placeholder="Search products..." /><select id="p-cat"><option value="all">All categories</option>' + CATS.map(c => '<option>' + c + '</option>').join('') + '</select><button class="btn-s btn-p" id="p-add">+ Add product</button><button class="btn-s danger" id="p-reset">Reset all changes</button></div><div class="panel"><div class="tbl-wrap" id="p-list"></div></div>';
        $('p-q').addEventListener('input', e => { q = e.target.value.toLowerCase(); renderProducts(); });
        $('p-cat').addEventListener('change', e => { cat = e.target.value; renderProducts(); });
        $('p-add').addEventListener('click', () => openForm(null));
        $('p-reset').addEventListener('click', () => { if (confirm('Remove every admin change (new products, edits, stock, sold-out)?')) { localStorage.removeItem('techhub_catalog'); location.reload(); } });
      }
      const list = Object.values(PRODUCTS_DATA).filter(p => (cat === 'all' || p.category === cat) && (p.name + ' ' + p.brand).toLowerCase().indexOf(q) > -1);
      $('p-list').innerHTML = '<table><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>' + list.map(p =>
        '<tr><td><img class="thumb" src="' + escapeHtml(p.image) + '" alt="" onerror="this.style.visibility=\'hidden\'"></td><td><b>' + escapeHtml(p.name) + '</b><div class="muted">' + escapeHtml(p.brand) + '</div></td><td>' + escapeHtml(p.category) + '</td><td>' + peso(p.price) + '</td>' +
        '<td><input class="stk" type="number" min="0" value="' + getStock(p.id) + '" data-stock="' + p.id + '"></td><td>' + statusChip(p.id) + '</td>' +
        '<td><div class="actions"><button class="btn-s" data-sold="' + p.id + '">' + (isSoldOut(p.id) ? 'Restock' : 'Mark sold out') + '</button><button class="btn-s" data-edit="' + p.id + '">Edit</button><button class="btn-s danger" data-del="' + p.id + '">Delete</button></div></td></tr>').join('') + '</table>' + (list.length ? '' : '<div class="empty">No products match.</div>');
    }
    $('tab-products').addEventListener('change', e => {
      const id = e.target.dataset.stock; if (!id) return;
      const o = readOverrides(), n = Math.max(0, parseInt(e.target.value, 10) || 0);
      o.stock[id] = n; if (n > 0) delete o.soldout[id]; else o.soldout[id] = true;
      saveOverrides(o); toast('Stock updated'); setTimeout(renderAll, 0);
    });
    $('tab-products').addEventListener('click', e => {
      const t = e.target; const o = readOverrides();
      if (t.dataset.sold) { const id = t.dataset.sold; if (isSoldOut(id)) { delete o.soldout[id]; o.stock[id] = 10; } else { o.soldout[id] = true; } saveOverrides(o); toast('Updated'); renderAll(); }
      if (t.dataset.edit) openForm(t.dataset.edit);
      if (t.dataset.del && confirm('Delete "' + PRODUCTS_DATA[t.dataset.del].name + '" from the store?')) {
        const id = t.dataset.del;
        if (o.added[id]) delete o.added[id]; else if (o.deleted.indexOf(id) < 0) o.deleted.push(id);
        delete o.edits[id]; delete o.stock[id]; delete o.soldout[id]; saveOverrides(o); toast('Product deleted'); location.reload();
      }
    });

    // ---------- product form ----------
    $('f-cat').innerHTML = CATS.map(c => '<option>' + c + '</option>').join('');
    function openForm(id) {
      editingId = id; imageData = null; $('pm-err').textContent = ''; $('f-file').value = '';
      const p = id ? PRODUCTS_DATA[id] : {};
      $('pm-title').textContent = id ? 'Edit Product' : 'Add Product';
      $('f-name').value = p.name || ''; $('f-brand').value = p.brand || ''; $('f-cat').value = p.category || 'smartphones';
      $('f-price').value = p.price || ''; $('f-old').value = p.oldPrice || ''; $('f-stock').value = id ? getStock(id) : 20;
      $('f-img').value = p.image && p.image.indexOf('data:') !== 0 ? p.image : ''; $('f-def').value = p.definition || '';
      $('f-specs').value = (p.specs || []).join('\n'); $('f-colors').value = (p.colors || []).join(', ');
      $('pm').classList.remove('hidden');
    }
    $('pm-cancel').addEventListener('click', () => $('pm').classList.add('hidden'));
    $('f-file').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); imageData = c.toDataURL('image/jpeg', 0.8); }; im.src = r.result; };
      r.readAsDataURL(f);
    });
    $('pm-form').addEventListener('submit', e => {
      e.preventDefault();
      const price = Number($('f-price').value), old = Number($('f-old').value) || 0;
      if (old && old <= price) { $('pm-err').textContent = 'Old price must be higher than the price (or leave it empty).'; return; }
      const data = { name: $('f-name').value.trim(), brand: $('f-brand').value.trim(), category: $('f-cat').value, price: price, oldPrice: old, discount: old ? Math.round((old - price) / old * 100) : 0, image: imageData || $('f-img').value.trim() || (editingId ? PRODUCTS_DATA[editingId].image : ''), definition: $('f-def').value.trim(),
        specs: $('f-specs').value.split('\n').map(x => x.trim()).filter(Boolean),
        colors: $('f-colors').value.split(',').map(x => x.replace(/['"<>`\\]/g, '').trim()).filter(Boolean) };
      if (!data.colors.length) data.colors = ['Standard'];
      const o = readOverrides(), stock = Math.max(0, parseInt($('f-stock').value, 10) || 0);
      let id = editingId;
      if (!id) { id = 'c' + Date.now(); o.added[id] = Object.assign({ id: id, rating: 4.5, reviews: 0, specs: [], colors: ['Standard'] }, data); }
      else if (o.added[id]) Object.assign(o.added[id], data); else o.edits[id] = Object.assign(o.edits[id] || {}, data);
      o.stock[id] = stock; if (stock > 0) delete o.soldout[id]; else o.soldout[id] = true;
      try { saveOverrides(o); } catch (err) { $('pm-err').textContent = 'Saving failed (the picture may be too large).'; return; }
      location.reload();
    });

    // ---------- messages ----------
    let mf = 'all';
    function renderMessages() {
      const msgs = loadJSON('techhub_messages', []), fresh = msgs.filter(m => m.status === 'new').length;
      $('msg-pill').textContent = fresh; $('msg-pill').classList.toggle('hidden', !fresh);
      const show = msgs.filter(m => mf === 'all' || m.status === mf);
      $('tab-messages').innerHTML = '<div class="bar"><select id="m-f"><option value="all">All messages</option><option value="new">New</option><option value="resolved">Resolved</option></select><span class="muted">' + msgs.length + ' total, ' + fresh + ' new</span></div><div class="panel">' +
        (show.map(m => '<div class="msg"><div class="msg-head"><div><b>' + escapeHtml(m.name) + '</b> <span class="muted">' + escapeHtml(m.email) + '</span></div><div><span class="chip ' + (m.status === 'new' ? 'new' : 'ok') + '">' + (m.status === 'new' ? 'New' : 'Resolved') + '</span> <span class="muted">' + new Date(m.date).toLocaleString() + '</span></div></div>' +
          '<div class="muted" style="margin-top:6px">Subject: ' + escapeHtml(m.subject) + '</div><p>' + escapeHtml(m.message) + '</p><div class="actions"><button class="btn-s" data-toggle="' + m.id + '">' + (m.status === 'new' ? 'Mark resolved' : 'Mark as new') + '</button><a class="btn-s" href="mailto:' + encodeURIComponent(m.email) + '?subject=' + encodeURIComponent('Re: ' + m.subject) + '">Reply by email</a><button class="btn-s danger" data-mdel="' + m.id + '">Delete</button></div></div>').join('') || '<div class="empty">No messages yet. Messages sent through the Contact Us page appear here.</div>') + '</div>';
      $('m-f').value = mf;
    }
    $('tab-messages').addEventListener('change', e => { if (e.target.id === 'm-f') { mf = e.target.value; setTimeout(renderMessages, 0); } });
    $('tab-messages').addEventListener('click', e => {
      const t = e.target, msgs = loadJSON('techhub_messages', []);
      if (t.dataset.toggle) { const m = msgs.find(x => x.id === t.dataset.toggle); m.status = m.status === 'new' ? 'resolved' : 'new'; }
      else if (t.dataset.mdel) { if (!confirm('Delete this message?')) return; msgs.splice(msgs.findIndex(x => x.id === t.dataset.mdel), 1); }
      else return;
      localStorage.setItem('techhub_messages', JSON.stringify(msgs)); renderAll();
    });

    function renderAll() { renderDashboard(); renderProducts(); renderMessages(); }
    if (sessionStorage.getItem('techhub_admin') === '1') showApp();
  </script>
</body>
</html>
